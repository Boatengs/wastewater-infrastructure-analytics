budgets:
  - 1000000
  - 5000000
  - 10000000
  - 25000000

selection_method: greedy_risk_per_dollar
minimum_risk_category: moderate

readiness_multiplier:
  ready: 1.0
  planning: 0.9
  concept: 0.75
  unknown: 0.8

notes:
  - Budget scenarios are planning exercises, not adopted capital programs.
  - The starter allocator uses a transparent greedy heuristic rather than a full optimization model.
  - Production use should include project dependencies, bundling, regulatory commitments, coordination opportunities, and delivery constraints.
