[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wastewater-infrastructure-analytics"
version = "0.1.0"
description = "Analytics tools for wastewater infrastructure condition, risk, lifecycle economics, and capital planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "matplotlib>=3.9",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
geo = [
  "geopandas>=1.0",
  "shapely>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
